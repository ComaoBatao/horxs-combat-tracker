<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HORXS OBS Overlay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}
body{font-family:"Press Start 2P",monospace;color:#fff6d6}
#stage{width:100vw;height:100vh;position:relative}
.pixel{border:4px solid #110b22;box-shadow:0 0 0 4px #5f4a96,0 8px 0 #110b22,8px 8px 0 rgba(0,0,0,.3);background:rgba(32,22,56,.94)}
.hidden{display:none!important}
body.overlay-off #waiting,
body.overlay-off #full,
body.overlay-off #minimal,
body.overlay-off #roster{
  display:none!important;
}
.waiting{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);padding:16px 20px;font-size:12px;line-height:1.7;text-align:center}
.full{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(780px,80vw);padding:20px 24px}
.overlayPortrait{width:118px;height:118px;margin:10px auto 8px;border:4px solid #110b22;background:#120c20;display:grid;place-items:center;overflow:hidden;color:#8af2ff;font-size:26px;box-shadow:0 0 0 4px rgba(95,74,150,.65)}
.overlayPortrait img{width:100%;height:100%;object-fit:cover;display:none;image-rendering:auto}
.overlayPortrait.has-image img{display:block}
.overlayPortrait.has-image span{display:none}
.kicker{font-size:10px;color:#8af2ff;text-align:center;line-height:1.6}
.name{font-size:clamp(24px,3vw,44px);text-align:center;line-height:1.4;color:#fff59e;text-shadow:4px 4px 0 #110b22;margin:10px 0 14px;word-break:break-word}
.meta{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:10px;line-height:1.7;color:#e8dcff}
.roleBadge{display:inline-block;padding:5px 8px;border:3px solid #110b22;font-size:8px;line-height:1}
.role-player{background:#174b73;color:#8fe9ff}
.role-npc{background:#514522;color:#ffe98a}
.role-enemy{background:#5b2626;color:#ffb0a0}
.role-boss{background:#6d1c39;color:#ff9fbd;box-shadow:0 0 0 2px rgba(255,79,154,.2)}
.rosterRow.player{border-left:7px solid #36c5f0}
.rosterRow.npc{border-left:7px solid #e3bd45}
.rosterRow.enemy{border-left:7px solid #ff7a59}
.rosterRow.boss{border-left:7px solid #ff4f9a}
.voice-speaking{color:#fff !important;text-shadow:0 0 12px rgba(255,255,255,.7)}
.voice-idle{color:#8d8794 !important}
.voice-muted{color:#ff5f70 !important;text-shadow:0 0 10px rgba(255,70,90,.45)}
.hpArea{margin-top:14px}
.hpText{font-size:11px;line-height:1.6;margin-bottom:7px;text-align:center}
.hpOuter{height:24px;border:4px solid #110b22;background:#160e27;padding:2px}
.hpInner{height:100%;background:linear-gradient(90deg,#36d36f,#8df29c);transition:width .2s ease}
.hpInner.low{background:linear-gradient(90deg,#f0b13b,#ffd75a)}
.hpInner.critical{background:linear-gradient(90deg,#cc3f52,#ff6b6b)}
.hpInner.dead{background:#5f536f}
.effects{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.effect{border:3px solid #110b22;background:#3a285c;padding:8px 10px;font-size:9px;line-height:1.5;color:#fff1a8}
.minimal{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);padding:16px 28px;min-width:420px;text-align:center}
.minimal .overlayPortrait{width:78px;height:78px;font-size:18px;margin:8px auto 4px}
.minimal .name{margin:4px 0 0}
.roster{position:absolute;left:3%;bottom:5%;width:min(500px,45vw);padding:14px}
.rosterTitle{font-size:10px;color:#8af2ff;margin-bottom:10px}
.bossSection{
  display:none;
  margin:0 0 14px;
  padding:10px;
  background:rgba(63,18,45,.88);
  border:4px solid #110b22;
  box-shadow:inset 0 0 0 3px rgba(255,79,154,.12);
}
.bossSection.show{display:block}
.bossSectionTitle{
  font-size:10px;
  color:#ff9fbd;
  text-align:center;
  line-height:1.5;
  margin-bottom:8px;
  text-shadow:2px 2px 0 #110b22;
}
.bossRow{
  margin:8px 0;
  padding:11px;
  background:linear-gradient(180deg,rgba(95,25,64,.96),rgba(42,16,39,.96));
  border:4px solid #110b22;
}
.bossRow.active{outline:4px solid #ff4f9a}
.bossRow .rosterMain{grid-template-columns:58px 1fr}
.bossRow .rosterAvatar{width:58px;height:58px}
.bossRow .rosterTop{font-size:10px}
.bossHp{color:#ffb3ca}
.rosterRow{margin:8px 0;padding:8px;background:rgba(15,10,28,.72);border:3px solid #110b22}
.rosterMain{display:grid;grid-template-columns:48px 1fr;gap:9px;align-items:center}
.rosterAvatar{width:48px;height:48px;border:3px solid #110b22;background:#120c20;display:grid;place-items:center;overflow:hidden;color:#8af2ff;font-size:12px}
.rosterAvatar img{width:100%;height:100%;object-fit:cover;image-rendering:auto}
.rosterTop{display:flex;justify-content:space-between;gap:12px;font-size:9px;line-height:1.5}
.rosterRow.active{outline:4px solid #00d9ff}
.roster .hpOuter{height:15px;margin-top:6px;border-width:3px}
.error{color:#ff9eaa}
</style>
</head>
<body>
<div id="stage">
  <div id="waiting" class="waiting pixel">A ligar ao HORXS...</div>

  <div id="full" class="full pixel hidden">
    <div class="kicker">É A VEZ DE</div>
    <div id="fullAvatar" class="overlayPortrait"><img id="fullAvatarImg" alt=""><span id="fullAvatarFallback">?</span></div>
    <div id="fullName" class="name">—</div>
    <div class="meta"><span id="fullRole" class="roleBadge role-player">PLAYER</span><span id="fullRound">RODADA 1</span><span id="fullHpMeta">HP —</span></div>
    <div class="hpArea">
      <div id="fullHpText" class="hpText">HP 0 / 0</div>
      <div class="hpOuter"><div id="fullHpBar" class="hpInner" style="width:0%"></div></div>
    </div>
    <div id="fullEffects" class="effects"></div>
  </div>

  <div id="minimal" class="minimal pixel hidden">
    <div class="kicker">É A VEZ DE</div>
    <div id="minimalAvatar" class="overlayPortrait"><img id="minimalAvatarImg" alt=""><span id="minimalAvatarFallback">?</span></div>
    <div id="minimalName" class="name">—</div>
    <div style="text-align:center"><span id="minimalRole" class="roleBadge role-player">PLAYER</span></div>
  </div>

  <div id="roster" class="roster pixel hidden">
    <div class="rosterTitle">HP DOS PERSONAGENS</div>

    <div id="bossSection" class="bossSection">
      <div class="bossSectionTitle">BOSS</div>
      <div id="bossList"></div>
    </div>

    <div id="rosterList"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const session = params.get("session");
  const mode = ["full","minimal","roster"].includes(params.get("mode")) ? params.get("mode") : "full";
  const encodedCfg = params.get("cfg");
  const bridgeId = params.get("bridge") || "";
  let discordVoice = {online:false, participants:{}};
  let lastData = null;

  const $ = id => document.getElementById(id);
  const waiting = $("waiting");

  function decodeConfig(value){
    let s = value.replace(/-/g,"+").replace(/_/g,"/");
    while (s.length % 4) s += "=";
    const binary = atob(s);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function fail(message){
    waiting.classList.remove("hidden");
    waiting.classList.add("error");
    waiting.textContent = message;
  }

  function hpInfo(char){
    const max = Math.max(1, Number(char?.maxHp) || 1);
    const current = Math.max(0, Number(char?.currentHp) || 0);
    const percent = Math.max(0, Math.min(100, (current / max) * 100));
    const cls = current <= 0 ? "dead" : percent <= 25 ? "critical" : percent <= 50 ? "low" : "";
    return {max,current,percent,cls};
  }

  function voiceFor(char){
    const id = String(char?.discordUserId || "");
    return id ? (discordVoice?.participants?.[id] || null) : null;
  }

  function voiceClass(char){
    const v = voiceFor(char);
    if (!v) return "";
    if (v.muted || v.deafened) return "voice-muted";
    if (v.speaking) return "voice-speaking";
    return "voice-idle";
  }

  function roleOf(char){
    return ["PLAYER","NPC","ENEMY","BOSS"].includes(char?.role) ? char.role : "PLAYER";
  }

  function roleCss(char){
    return roleOf(char).toLowerCase();
  }

  function avatarData(char){
    const s = String(char?.avatar || "");
    return /^data:image\/(?:png|jpeg|webp);base64,/i.test(s) ? s : "";
  }

  function initialOf(char){
    const name = String(char?.name || "?").trim();
    return (name[0] || "?").toUpperCase();
  }

  function setPortrait(prefix, char){
    const box = $(`${prefix}Avatar`);
    const img = $(`${prefix}AvatarImg`);
    const fallback = $(`${prefix}AvatarFallback`);
    if (!box || !img || !fallback) return;
    if (!char) {
      img.removeAttribute("src");
      box.classList.remove("has-image");
      box.classList.add("hidden");
      return;
    }
    box.classList.remove("hidden");
    const avatar = avatarData(char);
    if (avatar) {
      img.src = avatar;
      box.classList.add("has-image");
    } else {
      img.removeAttribute("src");
      box.classList.remove("has-image");
      fallback.textContent = initialOf(char);
    }
  }

  function avatarHtml(char){
    const avatar = avatarData(char);
    return avatar
      ? `<div class="rosterAvatar"><img src="${esc(avatar)}" alt="${esc(char?.name || "")}"></div>`
      : `<div class="rosterAvatar">${esc(initialOf(char))}</div>`;
  }

  function esc(value){
    return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
  }

  function render(data){
    lastData = data;
    if (!data || !Array.isArray(data.characters)) {
      document.body.classList.remove("overlay-off");
      waiting.classList.remove("hidden");
      waiting.textContent = "À espera de dados do combate...";
      return;
    }

    const overlayVisible = data.overlayVisible !== false;
    document.body.classList.toggle("overlay-off", !overlayVisible);

    if (!overlayVisible) {
      waiting.classList.add("hidden");
      $("full").classList.add("hidden");
      $("minimal").classList.add("hidden");
      $("roster").classList.add("hidden");
      return;
    }

    waiting.classList.add("hidden");
    $("full").classList.toggle("hidden", mode !== "full");
    $("minimal").classList.toggle("hidden", mode !== "minimal");
    $("roster").classList.toggle("hidden", mode !== "roster");

    const current = data.started ? data.characters[data.currentIndex] : null;

    if (mode === "full") {
      if (!current) {
        setPortrait("full", null);
        $("fullName").textContent = "COMBATE NÃO INICIADO";
        $("fullHpMeta").textContent = "";
        $("fullRole").textContent = "";
        $("fullRole").className = "roleBadge hidden";
        $("fullHpText").textContent = "";
        $("fullHpBar").style.width = "0%";
        $("fullEffects").innerHTML = "";
        return;
      }

      const hp = hpInfo(current);
      setPortrait("full", current);
      $("fullName").textContent = current.name;
      $("fullName").className = `name ${voiceClass(current)}`;
      const currentRole = roleOf(current);
      $("fullRole").textContent = currentRole;
      $("fullRole").className = `roleBadge role-${roleCss(current)}`;
      $("fullRound").textContent = `RODADA ${data.round || 1}`;
      const visibleMaxHp = currentRole === "BOSS" && current.hideMaxHpOverlay ? "???" : hp.max;
      $("fullHpMeta").textContent = `HP ${hp.current}/${visibleMaxHp}`;
      $("fullHpText").textContent = `HP ${hp.current} / ${visibleMaxHp}`;
      $("fullHpBar").style.width = `${hp.percent}%`;
      $("fullHpBar").className = `hpInner ${hp.cls}`;

      const effects = (data.effects || []).filter(e => e.characterId === current.id);
      $("fullEffects").innerHTML = effects.length
        ? effects.map(e => `<div class="effect">${esc(e.name)} · ${Number(e.turns)||0}T</div>`).join("")
        : `<div class="effect">SEM EFEITOS</div>`;
    }

    if (mode === "minimal") {
      setPortrait("minimal", current);
      $("minimalName").textContent = current ? current.name : "COMBATE NÃO INICIADO";
      $("minimalName").className = `name ${current ? voiceClass(current) : ""}`;
      const r = current ? roleOf(current) : "";
      $("minimalRole").textContent = r;
      $("minimalRole").className = current ? `roleBadge role-${roleCss(current)}` : "roleBadge hidden";
    }

    if (mode === "roster") {
      const withIndex = data.characters.map((char, i) => ({char, i}));
      const bosses = withIndex.filter(item => roleOf(item.char) === "BOSS");
      const others = withIndex.filter(item => roleOf(item.char) !== "BOSS");

      $("bossSection").classList.toggle("show", bosses.length > 0);

      $("bossList").innerHTML = bosses.map(({char, i}) => {
        const hp = hpInfo(char);
        const maxText = char.hideMaxHpOverlay ? "???" : hp.max;

        return `<div class="bossRow ${data.started && i === data.currentIndex ? "active" : ""}">
          <div class="rosterMain">
            ${avatarHtml(char)}
            <div>
              <div class="rosterTop">
                <span class="${voiceClass(char)}">${esc(char.name)} <span class="roleBadge role-boss">BOSS</span></span>
                <span class="bossHp">${hp.current}/${maxText}</span>
              </div>
              <div class="hpOuter"><div class="hpInner ${hp.cls}" style="width:${hp.percent}%"></div></div>
            </div>
          </div>
        </div>`;
      }).join("");

      $("rosterList").innerHTML = others.length
        ? others.map(({char, i}) => {
            const hp = hpInfo(char);
            const role = roleOf(char);
            return `<div class="rosterRow ${roleCss(char)} ${data.started && i === data.currentIndex ? "active" : ""}">
              <div class="rosterMain">
                ${avatarHtml(char)}
                <div>
                  <div class="rosterTop"><span class="${voiceClass(char)}">${esc(char.name)} <span class="roleBadge role-${roleCss(char)}">${role}</span></span><span>${hp.current}/${hp.max}</span></div>
                  <div class="hpOuter"><div class="hpInner ${hp.cls}" style="width:${hp.percent}%"></div></div>
                </div>
              </div>
            </div>`;
          }).join("")
        : (bosses.length ? "" : `<div class="effect">SEM PERSONAGENS</div>`);
    }
  }

  async function start(){
    if (!session || !encodedCfg) return fail("Link OBS inválido: falta sessão ou configuração.");
    try {
      const cfg = decodeConfig(encodedCfg);
      const app = firebase.initializeApp(cfg, `overlay-${Date.now()}`);
      await app.auth().signInAnonymously();
      const db = app.database();

      if (bridgeId) {
        db.ref(`discordBridges/${bridgeId}`).on("value", snap => {
          const data = snap.val() || {};
          discordVoice = {online:Boolean(data.online), participants:data.participants || {}};
          if (lastData) render(lastData);
        });
      }

      db.ref(`horxsSessions/${session}`).on("value", snap => render(snap.val()), err => fail(`Erro Firebase: ${err.message}`));
    } catch (err) {
      fail(`Erro ao ligar: ${err.message}`);
    }
  }

  start();
})();
</script>
</body>
</html>
